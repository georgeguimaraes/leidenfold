name: Build precompiled NIFs

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_release:
    name: NIF ${{ matrix.nif }} - ${{ matrix.job.target }}
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        nif: ["2.15", "2.16", "2.17"]
        job:
          - { target: aarch64-apple-darwin, os: macos-14 }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          - { target: x86_64-pc-windows-msvc, os: windows-2022 }

    env:
      LEIDENFOLD_BUILD: "true"
      STATIC_LINK: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.job.target }}

      - name: Install Erlang/Elixir (Unix)
        if: runner.os != 'Windows'
        uses: erlef/setup-beam@v1
        with:
          otp-version: "26"
          elixir-version: "1.16"

      - name: Install Erlang/Elixir (Windows)
        if: runner.os == 'Windows'
        uses: erlef/setup-beam@v1
        with:
          otp-version: "26"
          elixir-version: "1.16"

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake automake autoconf libtool bison flex

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential automake autoconf libtool bison flex

      - name: Build igraph (static, Unix)
        if: runner.os != 'Windows'
        run: |
          git clone --depth 1 --branch 0.10.15 https://github.com/igraph/igraph.git
          cd igraph
          mkdir build && cd build
          cmake .. \
            -DCMAKE_INSTALL_PREFIX="$HOME/.local" \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DIGRAPH_USE_INTERNAL_BLAS=ON \
            -DIGRAPH_USE_INTERNAL_LAPACK=ON \
            -DIGRAPH_USE_INTERNAL_ARPACK=ON \
            -DIGRAPH_USE_INTERNAL_GLPK=ON \
            -DIGRAPH_USE_INTERNAL_GMP=ON
          make -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)
          make install

      - name: Build igraph (static, Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git clone --depth 1 --branch 0.10.15 https://github.com/igraph/igraph.git
          cd igraph
          mkdir build
          cd build
          cmake .. `
            -DCMAKE_INSTALL_PREFIX="$env:USERPROFILE\.local" `
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON `
            -DBUILD_SHARED_LIBS=OFF `
            -DIGRAPH_USE_INTERNAL_BLAS=ON `
            -DIGRAPH_USE_INTERNAL_LAPACK=ON `
            -DIGRAPH_USE_INTERNAL_ARPACK=ON `
            -DIGRAPH_USE_INTERNAL_GLPK=ON `
            -DIGRAPH_USE_INTERNAL_GMP=ON
          cmake --build . --config Release --parallel
          cmake --install . --config Release

      - name: Build libleidenalg (static, Unix)
        if: runner.os != 'Windows'
        run: |
          git clone --branch 0.11.1 --depth 1 https://github.com/vtraag/libleidenalg.git
          cd libleidenalg
          mkdir build && cd build
          cmake .. \
            -DCMAKE_INSTALL_PREFIX="$HOME/.local" \
            -DCMAKE_PREFIX_PATH="$HOME/.local" \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DBUILD_SHARED_LIBS=OFF
          make -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)
          make install

      - name: Build libleidenalg (static, Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git clone --branch 0.11.1 --depth 1 https://github.com/vtraag/libleidenalg.git
          cd libleidenalg
          mkdir build
          cd build
          cmake .. `
            -DCMAKE_INSTALL_PREFIX="$env:USERPROFILE\.local" `
            -DCMAKE_PREFIX_PATH="$env:USERPROFILE\.local" `
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON `
            -DBUILD_SHARED_LIBS=OFF
          cmake --build . --config Release --parallel
          cmake --install . --config Release

      - name: Get mix deps (Unix)
        if: runner.os != 'Windows'
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      - name: Get mix deps (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      - name: Build NIF (Unix)
        if: runner.os != 'Windows'
        env:
          NIF_VERSION: ${{ matrix.nif }}
          TARGET: ${{ matrix.job.target }}
        run: |
          export RUSTLER_NIF_VERSION="$NIF_VERSION"
          export LEIDENFOLD_STATIC_LIB_PATH="$HOME/.local/lib"
          export LEIDENFOLD_STATIC_INCLUDE_PATH="$HOME/.local/include"
          mix compile

      - name: Build NIF (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          NIF_VERSION: ${{ matrix.nif }}
          TARGET: ${{ matrix.job.target }}
        run: |
          $env:RUSTLER_NIF_VERSION = "$env:NIF_VERSION"
          $env:LEIDENFOLD_STATIC_LIB_PATH = "$env:USERPROFILE\.local\lib"
          $env:LEIDENFOLD_STATIC_INCLUDE_PATH = "$env:USERPROFILE\.local\include"
          mix compile

      - name: Create artifact (Unix)
        if: runner.os != 'Windows'
        id: artifact_unix
        env:
          TARGET: ${{ matrix.job.target }}
          NIF_VERSION: ${{ matrix.nif }}
          VERSION: ${{ github.ref_name }}
        run: |
          echo "=== Searching for built library ==="
          find . -name "libleidenfold_native.*" -type f 2>/dev/null || true

          # Look in priv/native first (where rustler_precompiled puts it)
          if [ -f "priv/native/libleidenfold_native.so" ]; then
            LIB_PATH="priv/native/libleidenfold_native.so"
            LIB_NAME="libleidenfold_native.so"
          elif [ -f "priv/native/libleidenfold_native.dylib" ]; then
            LIB_PATH="priv/native/libleidenfold_native.dylib"
            LIB_NAME="libleidenfold_native.dylib"
          elif [ -f "native/leidenfold_native/target/$TARGET/release/libleidenfold_native.so" ]; then
            LIB_PATH="native/leidenfold_native/target/$TARGET/release/libleidenfold_native.so"
            LIB_NAME="libleidenfold_native.so"
          elif [ -f "native/leidenfold_native/target/$TARGET/release/libleidenfold_native.dylib" ]; then
            LIB_PATH="native/leidenfold_native/target/$TARGET/release/libleidenfold_native.dylib"
            LIB_NAME="libleidenfold_native.dylib"
          elif [ -f "native/leidenfold_native/target/release/libleidenfold_native.so" ]; then
            LIB_PATH="native/leidenfold_native/target/release/libleidenfold_native.so"
            LIB_NAME="libleidenfold_native.so"
          elif [ -f "native/leidenfold_native/target/release/libleidenfold_native.dylib" ]; then
            LIB_PATH="native/leidenfold_native/target/release/libleidenfold_native.dylib"
            LIB_NAME="libleidenfold_native.dylib"
          else
            echo "No library found!"
            exit 1
          fi

          echo "Found library at: $LIB_PATH"

          # Format: lib{crate_name}-v{version}-nif-{nif_version}-{target}.so.tar.gz
          ARCHIVE_NAME="libleidenfold_native-${VERSION}-nif-${NIF_VERSION}-${TARGET}.so.tar.gz"
          INNER_NAME="libleidenfold_native-${VERSION}-nif-${NIF_VERSION}-${TARGET}.so"

          # Copy to temp dir with correct name, then create archive
          TEMP_DIR=$(mktemp -d)
          cp "$LIB_PATH" "$TEMP_DIR/$INNER_NAME"
          tar -czvf "$ARCHIVE_NAME" -C "$TEMP_DIR" "$INNER_NAME"
          rm -rf "$TEMP_DIR"
          echo "archive=$ARCHIVE_NAME" >> "$GITHUB_OUTPUT"
          echo "archive_path=$(pwd)/$ARCHIVE_NAME" >> "$GITHUB_OUTPUT"

      - name: Create artifact (Windows)
        if: runner.os == 'Windows'
        id: artifact_windows
        shell: pwsh
        env:
          TARGET: ${{ matrix.job.target }}
          NIF_VERSION: ${{ matrix.nif }}
          VERSION: ${{ github.ref_name }}
        run: |
          Write-Host "=== Searching for built library ==="
          Get-ChildItem -Recurse -Filter "leidenfold_native.dll" | ForEach-Object { Write-Host $_.FullName }

          # Find the DLL
          $dllPath = $null
          $searchPaths = @(
            "priv\native\leidenfold_native.dll",
            "native\leidenfold_native\target\$env:TARGET\release\leidenfold_native.dll",
            "native\leidenfold_native\target\release\leidenfold_native.dll"
          )
          foreach ($path in $searchPaths) {
            if (Test-Path $path) {
              $dllPath = $path
              break
            }
          }

          if (-not $dllPath) {
            Write-Host "No library found!"
            exit 1
          }

          Write-Host "Found library at: $dllPath"

          # Format: lib{crate_name}-v{version}-nif-{nif_version}-{target}.dll.tar.gz
          $archiveName = "libleidenfold_native-$env:VERSION-nif-$env:NIF_VERSION-$env:TARGET.dll.tar.gz"
          $innerName = "libleidenfold_native-$env:VERSION-nif-$env:NIF_VERSION-$env:TARGET.dll"

          # Copy to temp dir with correct name
          $tempDir = New-Item -ItemType Directory -Path ([System.IO.Path]::GetTempPath()) -Name ([System.Guid]::NewGuid().ToString())
          Copy-Item $dllPath -Destination "$($tempDir.FullName)\$innerName"

          # Create tarball using tar (available on Windows)
          tar -czvf $archiveName -C $tempDir.FullName $innerName
          Remove-Item -Recurse -Force $tempDir

          "archive=$archiveName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "archive_path=$((Get-Location).Path)\$archiveName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact_unix.outputs.archive || steps.artifact_windows.outputs.archive }}
          path: ${{ steps.artifact_unix.outputs.archive_path || steps.artifact_windows.outputs.archive_path }}

  publish:
    name: Publish release
    needs: build_release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: artifacts/**/*.tar.gz
          generate_release_notes: true

  update_checksums:
    name: Update checksums
    needs: publish
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p release_assets
          cd release_assets
          gh release download "${{ github.ref_name }}" --pattern "*.tar.gz"

      - name: Generate checksums
        run: |
          cd release_assets
          # Generate Elixir map format checksum file
          echo '%{' > ../checksum-Elixir.Leidenfold.Native.exs
          first=true
          for file in *.tar.gz; do
            checksum=$(sha256sum "$file" | cut -d' ' -f1)
            if [ "$first" = true ]; then
              first=false
            else
              echo ',' >> ../checksum-Elixir.Leidenfold.Native.exs
            fi
            printf '  "%s" => "sha256:%s"' "$file" "$checksum" >> ../checksum-Elixir.Leidenfold.Native.exs
          done
          echo '' >> ../checksum-Elixir.Leidenfold.Native.exs
          echo '}' >> ../checksum-Elixir.Leidenfold.Native.exs

          echo "=== Generated checksum file ==="
          cat ../checksum-Elixir.Leidenfold.Native.exs

      - name: Commit and push checksums
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add checksum-Elixir.Leidenfold.Native.exs
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: Update checksums for ${{ github.ref_name }}"
            git push origin main
          fi

  publish_hex:
    name: Publish to Hex
    needs: update_checksums
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main  # Get the updated checksums

      - name: Install Erlang/Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "26"
          elixir-version: "1.16"

      - name: Get dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      - name: Publish to Hex
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: mix hex.publish --yes
