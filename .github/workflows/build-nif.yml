name: Build precompiled NIFs

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_release:
    name: NIF ${{ matrix.nif }} - ${{ matrix.job.target }}
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        nif: ["2.16"]
        job:
          - { target: aarch64-apple-darwin, os: macos-14 }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04, use-cross: true }

    env:
      LEIDENFOLD_BUILD: "true"
      STATIC_LINK: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.job.target }}

      - name: Install Erlang/Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "26"
          elixir-version: "1.16"

      - name: Install dependencies (macOS)
        if: contains(matrix.job.os, 'macos')
        run: |
          brew install cmake automake autoconf libtool bison flex

      - name: Install dependencies (Linux)
        if: contains(matrix.job.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential automake autoconf libtool bison flex

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.job.use-cross
        run: |
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build igraph (static)
        env:
          TARGET: ${{ matrix.job.target }}
          USE_CROSS: ${{ matrix.job.use-cross }}
        run: |
          git clone --depth 1 --branch 0.10.15 https://github.com/igraph/igraph.git
          cd igraph
          mkdir build && cd build
          if [ "$USE_CROSS" = "true" ]; then
            cmake .. \
              -DCMAKE_SYSTEM_NAME=Linux \
              -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
              -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
              -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
              -DCMAKE_INSTALL_PREFIX="$HOME/.local" \
              -DBUILD_SHARED_LIBS=OFF \
              -DIGRAPH_USE_INTERNAL_BLAS=ON \
              -DIGRAPH_USE_INTERNAL_LAPACK=ON \
              -DIGRAPH_USE_INTERNAL_ARPACK=ON \
              -DIGRAPH_USE_INTERNAL_GLPK=ON \
              -DIGRAPH_USE_INTERNAL_GMP=ON
          else
            cmake .. \
              -DCMAKE_INSTALL_PREFIX="$HOME/.local" \
              -DBUILD_SHARED_LIBS=OFF \
              -DIGRAPH_USE_INTERNAL_BLAS=ON \
              -DIGRAPH_USE_INTERNAL_LAPACK=ON \
              -DIGRAPH_USE_INTERNAL_ARPACK=ON \
              -DIGRAPH_USE_INTERNAL_GLPK=ON \
              -DIGRAPH_USE_INTERNAL_GMP=ON
          fi
          make -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)
          make install

      - name: Build libleidenalg (static)
        env:
          USE_CROSS: ${{ matrix.job.use-cross }}
        run: |
          git clone --depth 1 https://github.com/vtraag/libleidenalg.git
          cd libleidenalg
          mkdir build && cd build
          if [ "$USE_CROSS" = "true" ]; then
            cmake .. \
              -DCMAKE_SYSTEM_NAME=Linux \
              -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
              -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
              -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
              -DCMAKE_INSTALL_PREFIX="$HOME/.local" \
              -DCMAKE_PREFIX_PATH="$HOME/.local" \
              -DBUILD_SHARED_LIBS=OFF
          else
            cmake .. \
              -DCMAKE_INSTALL_PREFIX="$HOME/.local" \
              -DCMAKE_PREFIX_PATH="$HOME/.local" \
              -DBUILD_SHARED_LIBS=OFF
          fi
          make -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)
          make install

      - name: Get mix deps
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      - name: Build NIF
        env:
          NIF_VERSION: ${{ matrix.nif }}
          TARGET: ${{ matrix.job.target }}
          USE_CROSS: ${{ matrix.job.use-cross }}
        run: |
          export RUSTLER_NIF_VERSION="$NIF_VERSION"
          export LEIDENFOLD_STATIC_LIB_PATH="$HOME/.local/lib"
          export LEIDENFOLD_STATIC_INCLUDE_PATH="$HOME/.local/include"
          if [ "$USE_CROSS" = "true" ]; then
            export CARGO_BUILD_TARGET="$TARGET"
          fi
          mix compile

      - name: Create artifact
        id: artifact
        env:
          TARGET: ${{ matrix.job.target }}
          NIF_VERSION: ${{ matrix.nif }}
        run: |
          ARTIFACT_DIR="native/leidenfold_native/target/$TARGET/release"
          if [ -d "$ARTIFACT_DIR" ]; then
            cd "$ARTIFACT_DIR"
          else
            cd "native/leidenfold_native/target/release"
          fi

          if [ -f "libleidenfold_native.so" ]; then
            LIB_NAME="libleidenfold_native.so"
          elif [ -f "libleidenfold_native.dylib" ]; then
            LIB_NAME="libleidenfold_native.dylib"
          else
            echo "No library found!"
            ls -la
            exit 1
          fi

          ARCHIVE_NAME="leidenfold_native-nif-$NIF_VERSION-$TARGET.tar.gz"
          tar -czvf "$ARCHIVE_NAME" "$LIB_NAME"
          echo "archive=$ARCHIVE_NAME" >> "$GITHUB_OUTPUT"
          echo "archive_path=$(pwd)/$ARCHIVE_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.archive }}
          path: ${{ steps.artifact.outputs.archive_path }}

  publish:
    name: Publish release
    needs: build_release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: artifacts/**/*.tar.gz
          generate_release_notes: true
