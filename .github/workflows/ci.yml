name: CI

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      igraph_version: ${{ steps.versions.outputs.igraph }}
      libleidenalg_version: ${{ steps.versions.outputs.libleidenalg }}
    steps:
      - id: versions
        run: |
          echo "igraph=0.10.15" >> $GITHUB_OUTPUT
          echo "libleidenalg=0.11.1" >> $GITHUB_OUTPUT

  test:
    name: Test (OTP ${{ matrix.otp }} / Elixir ${{ matrix.elixir }})
    needs: setup
    runs-on: macos-14

    strategy:
      matrix:
        otp: ["26", "27", "28"]
        elixir: ["1.17", "1.18", "1.19"]

    env:
      LEIDENFOLD_BUILD: "true"
      IGRAPH_VERSION: ${{ needs.setup.outputs.igraph_version }}
      LIBLEIDENALG_VERSION: ${{ needs.setup.outputs.libleidenalg_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Erlang/Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}

      - name: Install dependencies (macOS)
        run: |
          brew install cmake automake autoconf libtool bison flex

      - name: Build igraph (static)
        run: |
          git clone --depth 1 --branch ${{ env.IGRAPH_VERSION }} https://github.com/igraph/igraph.git
          cd igraph
          mkdir build && cd build
          cmake .. \
            -DCMAKE_INSTALL_PREFIX="$HOME/.local" \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DIGRAPH_USE_INTERNAL_BLAS=ON \
            -DIGRAPH_USE_INTERNAL_LAPACK=ON \
            -DIGRAPH_USE_INTERNAL_ARPACK=ON \
            -DIGRAPH_USE_INTERNAL_GLPK=ON \
            -DIGRAPH_USE_INTERNAL_GMP=ON
          make -j$(sysctl -n hw.ncpu)
          make install

      - name: Build libleidenalg (static)
        run: |
          git clone --branch ${{ env.LIBLEIDENALG_VERSION }} --depth 1 https://github.com/vtraag/libleidenalg.git
          cd libleidenalg
          mkdir build && cd build
          cmake .. \
            -DCMAKE_INSTALL_PREFIX="$HOME/.local" \
            -DCMAKE_PREFIX_PATH="$HOME/.local" \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DBUILD_SHARED_LIBS=OFF
          make -j$(sysctl -n hw.ncpu)
          make install

      - name: Get dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      - name: Compile
        run: |
          export LEIDENFOLD_STATIC_LIB_PATH="$HOME/.local/lib"
          export LEIDENFOLD_STATIC_INCLUDE_PATH="$HOME/.local/include"
          mix compile

      - name: Run tests
        run: mix test

  build-and-publish:
    name: Build and Publish
    needs: [setup, test]
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/build-and-publish.yml
    with:
      igraph_version: ${{ needs.setup.outputs.igraph_version }}
      libleidenalg_version: ${{ needs.setup.outputs.libleidenalg_version }}
    secrets: inherit
