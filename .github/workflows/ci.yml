name: CI

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      igraph_version: ${{ steps.versions.outputs.igraph }}
      libleidenalg_version: ${{ steps.versions.outputs.libleidenalg }}
    steps:
      - id: versions
        run: |
          echo "igraph=0.10.15" >> $GITHUB_OUTPUT
          echo "libleidenalg=0.11.1" >> $GITHUB_OUTPUT

  test:
    name: Test (OTP ${{ matrix.otp }} / Elixir ${{ matrix.elixir }})
    needs: setup
    runs-on: ubuntu-latest

    strategy:
      matrix:
        otp: ["26", "27", "28"]
        elixir: ["1.17", "1.18", "1.19"]
        exclude:
          # OTP 28 requires Elixir 1.18+
          - otp: "28"
            elixir: "1.17"

    env:
      LEIDENFOLD_BUILD: "true"
      IGRAPH_VERSION: ${{ needs.setup.outputs.igraph_version }}
      LIBLEIDENALG_VERSION: ${{ needs.setup.outputs.libleidenalg_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Erlang/Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential automake autoconf libtool bison flex

      - name: Cache native libs
        id: cache-native
        uses: actions/cache@v5
        with:
          path: ~/.local
          key: native-libs-ubuntu-igraph-${{ env.IGRAPH_VERSION }}-libleidenalg-${{ env.LIBLEIDENALG_VERSION }}

      - name: Build igraph (static)
        if: steps.cache-native.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch ${{ env.IGRAPH_VERSION }} https://github.com/igraph/igraph.git
          cd igraph
          mkdir build && cd build
          cmake .. \
            -DCMAKE_INSTALL_PREFIX="$HOME/.local" \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DIGRAPH_USE_INTERNAL_BLAS=ON \
            -DIGRAPH_USE_INTERNAL_LAPACK=ON \
            -DIGRAPH_USE_INTERNAL_ARPACK=ON \
            -DIGRAPH_USE_INTERNAL_GLPK=ON \
            -DIGRAPH_USE_INTERNAL_GMP=ON
          make -j$(nproc)
          make install

      - name: Build libleidenalg (static)
        if: steps.cache-native.outputs.cache-hit != 'true'
        run: |
          git clone --branch ${{ env.LIBLEIDENALG_VERSION }} --depth 1 https://github.com/vtraag/libleidenalg.git
          cd libleidenalg
          mkdir build && cd build
          cmake .. \
            -DCMAKE_INSTALL_PREFIX="$HOME/.local" \
            -DCMAKE_PREFIX_PATH="$HOME/.local" \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DBUILD_SHARED_LIBS=OFF
          make -j$(nproc)
          make install

      - name: Cache mix deps
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-

      - name: Get dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      - name: Compile
        run: |
          export LEIDENFOLD_STATIC_LIB_PATH="$HOME/.local/lib"
          export LEIDENFOLD_STATIC_INCLUDE_PATH="$HOME/.local/include"
          mix compile

      - name: Run tests
        run: mix test

  build-and-publish:
    name: Build and Publish
    needs: [setup, test]
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/build-and-publish.yml
    with:
      igraph_version: ${{ needs.setup.outputs.igraph_version }}
      libleidenalg_version: ${{ needs.setup.outputs.libleidenalg_version }}
    secrets: inherit
