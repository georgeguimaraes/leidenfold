name: Build and Publish

on:
  workflow_call:
    inputs:
      igraph_version:
        type: string
        default: "0.10.15"
      libleidenalg_version:
        type: string
        default: "0.11.1"
      version:
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      igraph_version:
        description: "igraph version"
        default: "0.10.15"
      libleidenalg_version:
        description: "libleidenalg version"
        default: "0.11.1"
      version:
        description: "Release tag to build and publish for (e.g. v0.4.0). Defaults to the pushed ref."
        default: ""

permissions:
  contents: write

env:
  IGRAPH_VERSION: ${{ inputs.igraph_version }}
  LIBLEIDENALG_VERSION: ${{ inputs.libleidenalg_version }}
  # A tag push sets this from the ref; workflow_dispatch can point at an
  # existing tag to rebuild its assets from main.
  RELEASE_TAG: ${{ inputs.version || github.ref_name }}

jobs:
  build_release:
    name: NIF ${{ matrix.nif }} - ${{ matrix.job.target }}
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        nif: ["2.15", "2.16", "2.17"]
        job:
          - { target: aarch64-apple-darwin, os: macos-14 }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }

    env:
      LEIDENFOLD_BUILD: "true"
      STATIC_LINK: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.job.target }}

      - name: Install Erlang/Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18"

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake automake autoconf libtool bison flex

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential automake autoconf libtool bison flex

      - name: Build igraph (static)
        run: |
          git clone --depth 1 --branch ${{ env.IGRAPH_VERSION }} https://github.com/igraph/igraph.git
          cd igraph
          mkdir build && cd build
          cmake .. \
            -DCMAKE_INSTALL_PREFIX="$HOME/.local" \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DIGRAPH_USE_INTERNAL_BLAS=ON \
            -DIGRAPH_USE_INTERNAL_LAPACK=ON \
            -DIGRAPH_USE_INTERNAL_ARPACK=ON \
            -DIGRAPH_USE_INTERNAL_GLPK=ON \
            -DIGRAPH_USE_INTERNAL_GMP=ON
          make -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)
          make install

      - name: Build libleidenalg (static)
        run: |
          git clone --branch ${{ env.LIBLEIDENALG_VERSION }} --depth 1 https://github.com/vtraag/libleidenalg.git
          cd libleidenalg
          mkdir build && cd build
          cmake .. \
            -DCMAKE_INSTALL_PREFIX="$HOME/.local" \
            -DCMAKE_PREFIX_PATH="$HOME/.local" \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DBUILD_SHARED_LIBS=OFF
          make -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)
          make install

      - name: Get mix deps
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      - name: Build NIF
        env:
          NIF_VERSION: ${{ matrix.nif }}
          TARGET: ${{ matrix.job.target }}
        run: |
          export RUSTLER_NIF_VERSION="$NIF_VERSION"
          export LEIDENFOLD_STATIC_LIB_PATH="$HOME/.local/lib"
          export LEIDENFOLD_STATIC_INCLUDE_PATH="$HOME/.local/include"
          mix compile

      - name: Create artifact
        id: artifact
        env:
          TARGET: ${{ matrix.job.target }}
          NIF_VERSION: ${{ matrix.nif }}
          VERSION: ${{ env.RELEASE_TAG }}
        run: |
          # rustler copies the finished NIF into priv/native as
          # leidenfold_native.so on every platform (no lib prefix, .so even on
          # macOS), which is exactly what rustler_precompiled expects. Fall
          # back to cargo's own output; its target dir moved from native/ to
          # the repo root in rustler 0.38.
          LIB_PATH=$(find -H _build priv target native -type f \
            \( -name "leidenfold_native.so" -o -name "libleidenfold_native.so" -o -name "libleidenfold_native.dylib" \) \
            -not -path "*/deps/*" 2>/dev/null | sort | sed -n 1p)

          if [ -z "$LIB_PATH" ]; then
            echo "No library found!"
            exit 1
          fi

          echo "Found library at: $LIB_PATH"

          ARCHIVE_NAME="libleidenfold_native-${VERSION}-nif-${NIF_VERSION}-${TARGET}.so.tar.gz"
          INNER_NAME="libleidenfold_native-${VERSION}-nif-${NIF_VERSION}-${TARGET}.so"

          TEMP_DIR=$(mktemp -d)
          cp "$LIB_PATH" "$TEMP_DIR/$INNER_NAME"
          tar -czvf "$ARCHIVE_NAME" -C "$TEMP_DIR" "$INNER_NAME"
          rm -rf "$TEMP_DIR"
          echo "archive=$ARCHIVE_NAME" >> "$GITHUB_OUTPUT"
          echo "archive_path=$(pwd)/$ARCHIVE_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.archive }}
          path: ${{ steps.artifact.outputs.archive_path }}

  publish:
    name: Publish release
    needs: build_release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      # release-please already created the release for this tag. softprops
      # insists on updating the release before uploading and that PATCH gets
      # a 403 whichever token it runs with, so upload the assets directly.
      - name: Upload assets to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          shopt -s globstar nullglob
          files=(artifacts/**/*.tar.gz)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No archives to upload"
            exit 1
          fi
          gh release upload "${{ env.RELEASE_TAG }}" "${files[@]}" --clobber

  update_checksums:
    name: Update checksums
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          mkdir -p release_assets
          cd release_assets
          gh release download "${{ env.RELEASE_TAG }}" --pattern "*.tar.gz"

      - name: Generate checksums
        run: |
          cd release_assets
          echo '%{' > ../checksum-Elixir.Leidenfold.Native.exs
          first=true
          for file in *.tar.gz; do
            checksum=$(sha256sum "$file" | cut -d' ' -f1)
            if [ "$first" = true ]; then
              first=false
            else
              echo ',' >> ../checksum-Elixir.Leidenfold.Native.exs
            fi
            printf '  "%s" => "sha256:%s"' "$file" "$checksum" >> ../checksum-Elixir.Leidenfold.Native.exs
          done
          echo '' >> ../checksum-Elixir.Leidenfold.Native.exs
          echo '}' >> ../checksum-Elixir.Leidenfold.Native.exs

          echo "=== Generated checksum file ==="
          cat ../checksum-Elixir.Leidenfold.Native.exs

      - name: Commit and push checksums
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add checksum-Elixir.Leidenfold.Native.exs
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: Update checksums for ${{ env.RELEASE_TAG }}"
            git push origin main
          fi

  publish_hex:
    name: Publish to Hex
    needs: update_checksums
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Install Erlang/Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18"

      - name: Get dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      - name: Publish to Hex
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: mix hex.publish --replace --yes
